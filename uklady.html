<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Układy logiczne</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Układy logiczne (jak Logisim, ale na telefon): piny, bramki, multiplekser, przyciski, zegar, dioda, własne podukłady,
   symulacja na żywo (kolory przewodów jak w Logisimie), tabela prawdy, zadania z laboratorium i zadania jak na teście (po angielsku) ze sprawdzaniem.
   Projekt zapisuje się w przeglądarce (localStorage „uklady-v1”), można go też zapisać do pliku i wczytać. */
:root {
  color-scheme: light;
  --bg: #f3f5f3; --surface: #ffffff; --ink: #18211c; --muted: #5c6962; --faint: #89958e; --line: #e1e7e3;
  --accent: #0b6b45; --accent-soft: #e2f1e9; --hot: #b42318; --hot-soft: #fbe3e0;
  --w1: #19b419; --w0: #0f5a12; --wz: #2a55d8; --we: #d1261b; --grid: #c9d2cc; --sel: #2b62c9;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1311; --surface: #171d1a; --ink: #e5ebe7; --muted: #9daaa3; --faint: #6f7c75; --line: #27312c;
    --accent: #52c48f; --accent-soft: #19322a; --hot: #ff8a7d; --hot-soft: #3a1f1c;
    --w1: #4ee04e; --w0: #2f7d33; --wz: #6f95ff; --we: #ff5b4f; --grid: #34403a; --sel: #82aaf7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1311; --surface: #171d1a; --ink: #e5ebe7; --muted: #9daaa3; --faint: #6f7c75; --line: #27312c;
  --accent: #52c48f; --accent-soft: #19322a; --hot: #ff8a7d; --hot-soft: #3a1f1c;
  --w1: #4ee04e; --w0: #2f7d33; --wz: #6f95ff; --we: #ff5b4f; --grid: #34403a; --sel: #82aaf7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; }
button { font: inherit; color: inherit; }
.top { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--line); }
.top a { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 1.3rem; }
.top select { flex: 1 1 auto; min-width: 0; height: 40px; padding: 0 10px; font: inherit; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.ib { flex: none; appearance: none; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--ink); cursor: pointer; }
.ib:disabled { color: var(--faint); opacity: 0.5; cursor: default; }
.ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#stage { flex: 1 1 auto; position: relative; overflow: hidden; touch-action: none; background: var(--surface); user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.zoom .ib { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 90px); padding: 8px 14px; border-radius: 99px; background: var(--ink); color: var(--surface); font-size: 0.88rem; font-weight: 600; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
#toast.on { opacity: 0.92; }
#selbar { position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); }
#selbar.on { display: flex; }
#selbar .nm { font-weight: 700; font-size: 0.9rem; padding: 0 4px; }
#selbar input { flex: 1 1 120px; min-width: 0; height: 38px; padding: 0 10px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
#selbar input:focus { outline: none; border-color: var(--accent); }
.pill { appearance: none; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 0.88rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pill.danger { color: var(--hot); }
.pill.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step { display: inline-flex; align-items: center; gap: 2px; font-size: 0.88rem; }
.step .pill { width: 38px; padding: 0; }
.tools { flex: none; display: flex; justify-content: space-around; gap: 2px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
.tool { appearance: none; flex: 1 1 0; max-width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: 0.72rem; font-weight: 600; cursor: pointer; }
.tool svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool.on { color: var(--accent); background: var(--accent-soft); }
#scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.3); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
#scrim.on { opacity: 1; pointer-events: auto; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 78dvh; overflow-y: auto; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); background: var(--surface); border-radius: 20px 20px 0 0; transform: translateY(105%); transition: transform 0.22s ease; box-shadow: 0 -6px 24px rgb(0 0 0 / 0.15); }
#sheet.on { transform: none; }
@media (min-width: 720px) { #sheet { left: 50%; right: auto; width: 640px; margin-left: -320px; } }
#sheet .grab { width: 40px; height: 4px; margin: 2px auto 10px; border-radius: 2px; background: var(--line); }
#sheet h2 { margin: 4px 0 10px; font-size: 1.1rem; }
#sheet h3 { margin: 16px 0 8px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
#sheet p { margin: 6px 0; line-height: 1.45; }
.pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.pal button { appearance: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 0.78rem; font-weight: 600; cursor: pointer; }
.pal svg { width: 64px; height: 40px; }
.menu { display: grid; gap: 6px; }
.menu button { appearance: none; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); text-align: left; font-weight: 600; cursor: pointer; }
.menu button.danger { color: var(--hot); }
.tt { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 8px 0; }
.tt th, .tt td { padding: 4px 9px; text-align: center; border-bottom: 1px solid var(--line); }
.tt th { font-size: 0.78rem; color: var(--muted); font-weight: 700; position: sticky; top: -8px; background: var(--surface); }
.tt .sep { border-left: 1.5px solid var(--line); }
.tt td.v1 { color: var(--accent); font-weight: 700; }
.tt td.ve { color: var(--hot); font-weight: 700; }
.task { padding: 12px; margin: 8px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.task.done { border-color: var(--accent); }
.task h4 { margin: 0 0 4px; font-size: 1rem; display: flex; gap: 8px; align-items: baseline; }
.task h4 .ok { color: var(--accent); }
.task .pins { font-size: 0.85rem; color: var(--muted); }
.task code { font-size: 0.85rem; padding: 1px 5px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.task .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.task .fb { margin-top: 8px; padding: 8px 10px; border-radius: 10px; font-size: 0.92rem; }
.task .fb.good { background: var(--accent-soft); }
.task .fb.bad { background: var(--hot-soft); }
.task ol { margin: 6px 0 0; padding-left: 1.3em; font-size: 0.92rem; }
.task .tt th { position: static; background: none; }
#sheet h3.grp { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--accent); }
.help li { margin: 4px 0; line-height: 1.4; }
/* rysunek */
.grid-dot { fill: var(--grid); }
.cb { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.cl { fill: none; stroke: var(--ink); stroke-width: 2; }
.w { fill: none; stroke-width: 3.2; stroke-linecap: round; }
.v1 { stroke: var(--w1); } .v0 { stroke: var(--w0); } .vz { stroke: var(--wz); } .ve { stroke: var(--we); }
.jd.v1 { fill: var(--w1); } .jd.v0 { fill: var(--w0); } .jd.vz { fill: var(--wz); } .jd.ve { fill: var(--we); }
.pin-st { stroke-width: 2; }
.pv { font-size: 13px; font-weight: 700; text-anchor: middle; fill: var(--ink); }
.pinbox.on { fill: var(--w1); }
.pinbox.ve { fill: var(--we); }
.pv.on { fill: #fff; }
.lb { font-size: 12px; font-weight: 600; fill: var(--ink); }
.sm { font-size: 9px; font-weight: 600; fill: var(--muted); }
.tx { font-size: 13px; fill: var(--ink); }
.led { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.led.on { fill: #ff3b30; }
.selbox { fill: none; stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 4 3; }
.selw { fill: none; stroke: var(--sel); stroke-width: 9; stroke-opacity: 0.3; stroke-linecap: round; }
.ghost { opacity: 0.5; }
.prev { fill: none; stroke: var(--sel); stroke-width: 3; stroke-dasharray: 6 4; }
.band { fill: var(--sel); fill-opacity: 0.08; stroke: var(--sel); stroke-dasharray: 4 3; }
.hotpt { fill: var(--sel); opacity: 0.6; }
</style>
</head>
<body>
<header class="top">
  <a href="./" aria-label="Wróć do notatek">‹</a>
  <select id="circ" aria-label="Układ"></select>
  <button class="ib" id="undo" aria-label="Cofnij"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ib" id="redo" aria-label="Ponów"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="ib" id="more" aria-label="Więcej"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
</header>
<main id="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
  <div class="zoom">
    <button class="ib" id="zin" aria-label="Powiększ"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" id="zout" aria-label="Pomniejsz"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="ib" id="zfit" aria-label="Pokaż cały układ"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="toast" role="status"></div>
  <div id="selbar"></div>
</main>
<nav class="tools">
  <button class="tool" data-mode="poke"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M12 10V4a1.5 1.5 0 0 1 3 0v6"/><path d="M15 10V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.8-2.4L3.6 14a1.5 1.5 0 0 1 2.3-2L9 14.5V11"/></svg>Rączka</button>
  <button class="tool" data-mode="edit"><svg viewBox="0 0 24 24"><path d="m5 3 14 8-6 1.5L10 19z"/></svg>Edycja</button>
  <button class="tool" data-mode="wire"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h5V6h5"/></svg>Przewód</button>
  <button class="tool" id="add"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Dodaj</button>
  <button class="tool" id="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>Zadania</button>
</nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
(function () {
"use strict";
var G = 10, Z = 2, E = 3, LS = "uklady-v1", LS_T = "uklady-zadania-v1";
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function snapv(v) { return Math.round(v / G) * G; }
function rot(x, y, f) { return f === 1 ? [-y, x] : f === 2 ? [-x, -y] : f === 3 ? [y, -x] : [x, y]; }
function byPos(a, b) { return a.y - b.y || a.x - b.x; }
var GATES = ["AND", "OR", "NAND", "NOR", "XOR", "XNOR"];
var NAMES = { in: "Wejście", out: "Wyjście", const: "Stała", button: "Przycisk", clock: "Zegar", led: "Dioda", text: "Tekst", NOT: "NOT", BUF: "Bufor", MUX: "Multiplekser",
  AND: "AND", OR: "OR", NAND: "NAND", NOR: "NOR", XOR: "XOR", XNOR: "XNOR" };

/* ---------- projekt ---------- */
function newProject() { return { seq: 1, cur: "main", order: ["main"], circuits: { main: { comps: [], wires: [] } } }; }
var P = (function () { try { var p = JSON.parse(lsGet(LS)); if (p && p.circuits && p.order && p.order.length) return p; } catch (e) {} return newProject(); })();
if (!P.circuits[P.cur]) P.cur = P.order[0];
function C() { return P.circuits[P.cur]; }
function nid(p) { return p + (P.seq++); }
var undoS = [], redoS = [], saveT = 0;
function snap() { undoS.push(JSON.stringify(P)); if (undoS.length > 120) undoS.shift(); redoS = []; }
function save() { clearTimeout(saveT); saveT = setTimeout(function () { lsSet(LS, JSON.stringify(P)); }, 250); }

/* ---------- kształty (współrzędne w px, element patrzy na wschód, punkt zaczepienia = wyjście albo pin) ---------- */
function gateYs(n) { return n === 2 ? [-20, 20] : n === 3 ? [-20, 0, 20] : n === 4 ? [-30, -10, 10, 30] : [-40, -20, 0, 20, 40]; }
function gateH(n) { return n <= 3 ? 25 : n === 4 ? 35 : 45; }
function subInfo(name) {
  var cc = P.circuits[name]; if (!cc) return { ins: [], outs: [] };
  return { ins: cc.comps.filter(function (c) { return c.t === "in"; }).sort(byPos), outs: cc.comps.filter(function (c) { return c.t === "out"; }).sort(byPos) };
}
function subSize(name) {
  var s = subInfo(name), n = Math.max(1, s.ins.length, s.outs.length), ml = function (a) { return a.reduce(function (m, c) { return Math.max(m, (c.lb || "").length); }, 0); };
  return { s: s, h: (n + 1) * 20, w: Math.max(40, Math.ceil(((ml(s.ins) + ml(s.outs)) * 6 + 22) / G) * G) };
}
function rt(x, y, f, inner) { return '<g transform="translate(' + x + " " + y + ") rotate(" + (-f * 90) + ')">' + inner + "</g>"; }
function vc(v) { return v === 1 ? "v1" : v === 0 ? "v0" : v === E ? "ve" : "vz"; }
function geo(c, st) {   // {pins:[{x,y,io}], box:[x1,y1,x2,y2], svg}; st – stan do rysowania (wartości)
  var t = c.t, f = c.f || 0, pins, box, svg = "";
  st = st || {};
  if (t === "in" || t === "button" || t === "clock" || t === "const") {
    var v = t === "in" || t === "clock" || t === "const" ? c.v | 0 : st.v;
    pins = [{ x: 0, y: 0, io: "out" }];
    if (t === "const") { box = [-16, -10, 0, 10]; svg = '<rect class="cb" x="-16" y="-10" width="16" height="20" rx="3"/>' + rt(-8, 0, f, '<text class="pv" y="4.5">' + v + "</text>"); }
    else if (t === "button") { box = [-20, -10, 0, 10]; svg = '<rect class="cb" x="-20" y="-10" width="20" height="20" rx="3"/><rect class="cb pinbox' + (v === 1 ? " on" : "") + '" x="-16" y="-6" width="12" height="12" rx="6"/>'; }
    else if (t === "clock") { box = [-20, -10, 0, 10]; svg = '<rect class="cb pinbox' + (v ? " on" : "") + '" x="-20" y="-10" width="20" height="20" rx="3"/>' + rt(-10, 0, f, '<path class="cl" style="stroke-width:1.5' + (v ? ";stroke:#fff" : "") + '" d="M-6 3H-3V-3H3V3H6"/>'); }
    else { box = [-20, -10, 0, 10]; svg = '<rect class="cb pinbox' + (v ? " on" : "") + '" x="-20" y="-10" width="20" height="20" rx="3"/>' + rt(-10, 0, f, '<text class="pv' + (v ? " on" : "") + '" y="4.5">' + v + "</text>"); }
  } else if (t === "out") {
    pins = [{ x: 0, y: 0, io: "in" }]; box = [0, -10, 20, 10];
    var o = st.v, ot = o === 1 ? "1" : o === 0 ? "0" : o === E ? "E" : "x";
    svg = '<rect class="cb pinbox' + (o === 1 ? " on" : o === E ? " ve" : "") + '" x="0" y="-10" width="20" height="20" rx="10"/>' + rt(10, 0, f, '<text class="pv' + (o === 1 || o === E ? " on" : "") + '" y="4.5">' + ot + "</text>");
  } else if (t === "led") {
    pins = [{ x: 0, y: 0, io: "in" }]; box = [0, -10, 20, 10];
    svg = '<circle class="led' + (st.v === 1 ? " on" : "") + '" cx="10" cy="0" r="9"/>';
  } else if (t === "text") {
    pins = []; var tw = Math.max(20, (c.lb || "Tekst").length * 7); box = [-tw / 2, -9, tw / 2, 7];
    svg = '<text class="tx" x="0" y="4" text-anchor="middle">' + esc(c.lb || "Tekst") + "</text>";
  } else if (t === "NOT" || t === "BUF") {
    pins = [{ x: -30, y: 0, io: "in" }, { x: 0, y: 0, io: "out" }]; box = [-30, -10, 0, 10];
    svg = t === "NOT" ? '<path class="cb" d="M-30 -10L-10 0L-30 10Z"/><circle class="cb" cx="-5" cy="0" r="4.5"/>' : '<path class="cb" d="M-30 -10L0 0L-30 10Z"/>';
  } else if (t === "MUX") {
    pins = [{ x: -30, y: -10, io: "in" }, { x: -30, y: 10, io: "in" }, { x: -20, y: 30, io: "in" }, { x: 0, y: 0, io: "out" }]; box = [-30, -30, 0, 30];
    svg = '<path class="cl" d="M-20 30V25"/><path class="cb" d="M-30 -30L0 -15L0 15L-30 30Z"/>' + rt(-24, -10, f, '<text class="sm" y="3" text-anchor="middle">0</text>') + rt(-24, 10, f, '<text class="sm" y="3" text-anchor="middle">1</text>');
  } else if (t === "sub") {
    var sz = subSize(c.sub), s = sz.s;
    pins = s.ins.map(function (_, i) { return { x: 0, y: 20 * (i + 1), io: "in" }; }).concat(s.outs.map(function (_, i) { return { x: sz.w, y: 20 * (i + 1), io: "out" }; }));
    box = [0, 0, sz.w, sz.h];
    svg = '<rect class="cb" x="0" y="0" width="' + sz.w + '" height="' + sz.h + '" rx="3"/>' +
      s.ins.map(function (p, i) { return rt(4, 20 * (i + 1), f, '<text class="sm" y="3"' + (f === 2 ? ' text-anchor="end"' : "") + ">" + esc(p.lb || "") + "</text>"); }).join("") +
      s.outs.map(function (p, i) { return rt(sz.w - 4, 20 * (i + 1), f, '<text class="sm" y="3"' + (f === 2 ? "" : ' text-anchor="end"') + ">" + esc(p.lb || "") + "</text>"); }).join("");
  } else {   // bramki
    var n = c.n || 2, ys = gateYs(n), h = gateH(n), neg = /^N|^XN/.test(t), base = t.replace(/^N(?=AND|OR)/, "").replace(/^XN/, "X");

  var cp = [
    { t: "in", x: 100, y: 100, lb: "I1", v: 0 }, { t: "in", x: 100, y: 160, lb: "SELECT", v: 0 }, { t: "in", x: 100, y: 240, lb: "I2", v: 0 },
    { t: "NOT", x: 220, y: 200 }, { t: "NAND", n: 2, x: 300, y: 120 }, { t: "NAND", n: 2, x: 300, y: 220 }, { t: "NAND", n: 2, x: 400, y: 170 },
    { t: "out", x: 430, y: 170, lb: "Q" }
  ].map(function (c) { c.id = nid("c"); c.f = 0; return c; });
  var ws = [[100, 100, 250, 100], [100, 160, 150, 160], [150, 140, 150, 200], [150, 140, 250, 140], [150, 200, 190, 200], [220, 200, 250, 200], [100, 240, 250, 240],
    [300, 120, 320, 120], [320, 120, 320, 150], [320, 150, 350, 150], [300, 220, 320, 220], [320, 220, 320, 190], [320, 190, 350, 190], [400, 170, 430, 170]]
    .map(function (a) { return { id: nid("w"), x1: a[0], y1: a[1], x2: a[2], y2: a[3] }; });
  P.circuits[name] = { comps: cp, wires: ws }; P.order.push(name); switchTo(name); setMode("poke", true);
  toast("Przykład „" + name + "”. Rączką zmieniaj SELECT, I1, I2 i patrz na Q.", 3500);
}

/* ---------- klawiatura ---------- */
document.addEventListener("keydown", function (e) {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  var k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === "y") { e.preventDefault(); redo(); }
  else if (mod && k === "c") { if (copySel()) toast("Skopiowano", 900); }
  else if (mod && k === "v") { e.preventDefault(); paste(20, 20); setMode("edit", true); selbar(); }
  else if (mod && k === "d") { e.preventDefault(); dupSel(); }
  else if (k === "delete" || k === "backspace") { if (sel.size) { e.preventDefault(); delSel(); } }
  else if (k === "r" && !mod) rotSel();
  else if (k === "escape") { placing = null; ghost = null; boxMode = false; sel.clear(); closeSheet(); selbar(); }
  else if (k === "1") setMode("poke"); else if (k === "2") setMode("edit"); else if (k === "3") setMode("wire");
});

/* ---------- start ---------- */
fillCirc(); setMode("poke", true); sim();
var empty = !P.order.some(function (n) { return P.circuits[n].comps.length; });
setTimeout(function () { var v = V(); v.fit = false; fit(); if (empty) toast("Dodaj → Wejście, Wyjście i bramki. Przewód: przeciągnij od nóżki do nóżki.", 4000); }, 0);
window.__uk = { P: function () { return P; }, sim: sim, checkTask: checkTask, TASKS: TASKS, runTable: runTable, pinsOf: pinsOf, example: example, set: function (p) { P = p; switchTo(P.cur); } };
})();
