<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notatki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<script>
/* tryb jasny/ciemny wybrany przyciskiem u góry (localStorage „notatki-theme”, wspólny z uklady.html); bez wyboru strona idzie za telefonem */
(function () {
  var t; try { t = localStorage.getItem("notatki-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") return;
  document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === "dark" ? "#0f1311" : "#f3f5f3"; });
})();
</script>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<title>Notatki z zajęć</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script id="katex-js" defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
/* Notatki z zajęć (SimpleAGH): zdjęcie tablicy z telefonu (i nagranie wykładu, przepisywane przez Groq) → prywatne repo na GitHubie → Claude Code w GitHub Actions robi notatkę.
   Dwie zakładki u góry: Aparat (wybór zajęć, spust, każde zdjęcie na żywo: wysyłanie → kolejka → Claude czyta → gotowe, wykres zdjęć według przedmiotu)
   i Notatki (foldery przedmiot + forma zajęć, w folderze notatki po dniach). Kolory i krój jak SimpleAGH. */
:root {
  --bg: #f3f5f3; --surface: #ffffff; --ink: #18211c; --muted: #5c6962; --faint: #89958e; --line: #e1e7e3;
  --accent: #0b6b45; --accent-soft: #e2f1e9; --hot: #b42318; --warn: #b26a00; --warn-soft: #fbefdc; --k-thm: #6a46c8; --k-ex: #2b62c9; --hl: #ffe680; --sx-s: #a3530f;
  --c-ma: #3b6fd8; --c-ha: #7b55d0; --c-dm: #0f8a7e; --c-lcs: #b8860b; --c-ics: #cc4b73; --c-unix: #3f8f34; --c-pl1: #d65a26; --c-kor: #5b6b84;
  --serif: "Source Serif 4", "Iowan Old Style", Charter, Georgia, serif;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans Math", sans-serif;
  --r: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311; --surface: #171d1a; --ink: #e5ebe7; --muted: #9daaa3; --faint: #6f7c75; --line: #27312c;
    --accent: #52c48f; --accent-soft: #19322a; --hot: #ff8a7d; --warn: #f0b44c; --warn-soft: #33281a; --k-thm: #b39af5; --k-ex: #82aaf7; --hl: rgb(240 190 70 / 0.35); --sx-s: #e5a774;
    --c-ma: #7ba3f5; --c-ha: #a98cf0; --c-dm: #42c2b4; --c-lcs: #e0b54a; --c-ics: #ee82a5; --c-unix: #82cc6e; --c-pl1: #ff9663; --c-kor: #a3b3cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311; --surface: #171d1a; --ink: #e5ebe7; --muted: #9daaa3; --faint: #6f7c75; --line: #27312c;
  --accent: #52c48f; --accent-soft: #19322a; --hot: #ff8a7d; --warn: #f0b44c; --warn-soft: #33281a; --k-thm: #b39af5; --k-ex: #82aaf7; --hl: rgb(240 190 70 / 0.35); --sx-s: #e5a774;
  --c-ma: #7ba3f5; --c-ha: #a98cf0; --c-dm: #42c2b4; --c-lcs: #e0b54a; --c-ics: #ee82a5; --c-unix: #82cc6e; --c-pl1: #ff9663; --c-kor: #a3b3cc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, h5, h6 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* górny pasek z zakładkami */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 10px; }
.bar .in { max-width: 680px; margin: 0 auto; display: grid; gap: 8px; }
.top { display: flex; align-items: baseline; gap: 10px; }
.brand { color: var(--accent); font-weight: 800; font-size: 0.82rem; letter-spacing: 0.02em; }
.home { margin-left: auto; color: var(--muted); font-size: 0.85rem; font-weight: 600; text-decoration: none; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tab { appearance: none; border: 0; background: none; border-radius: 10px; padding: 9px 4px; font-weight: 700; font-size: 0.98rem; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.tab svg { width: 19px; height: 19px; flex: none; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--surface); }
.visit .tabs { grid-template-columns: repeat(2, 1fr); }
/* pasek postępu notatki pod górnym paskiem: jasny – najdalej, dokąd już doczytałeś; ciemny – gdzie jesteś teraz */
.rd { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--line); pointer-events: none; }
.rd i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width 0.15s; }
.rd .mx { background: var(--accent); opacity: 0.35; }
.rd .now { background: var(--accent); }
.top .theme { margin: -6px 0 -6px auto; align-self: center; flex: none; appearance: none; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; }
.top .theme svg { width: 16px; height: 16px; }
.top .rd-t:not([hidden]) ~ .theme, .top .lang ~ .theme { margin-left: 0; }
.rd-t { margin-left: auto; color: var(--muted); font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: var(--surface); font-size: 0.75rem; font-weight: 800; display: inline-grid; place-items: center; }
main { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(48px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 26px; }
.pane { display: grid; gap: 26px; }
/* Nauka: ta sama strona co SimpleAGH na claude.ai (nauka.html z prywatnego repo), wysokość dopasowana do treści */
#pane-nauka { display: block; margin: -18px -16px 0; }
#keybox-slot:empty { display: none; }
#keybox-slot + #pane-nauka { margin-top: 0; }
#pane-nauka iframe { display: block; width: 100%; height: 80vh; border: 0; background: var(--bg); }
#pane-nauka .hint { padding: 18px 16px; }

.sec { display: grid; gap: 10px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h h2 { font-size: 1.2rem; font-weight: 700; }
.sec-h .aside { margin-left: auto; color: var(--muted); font-size: 0.88rem; }
.sub { color: var(--muted); font-size: 0.92rem; margin-top: -4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px; }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 6px; appearance: none; border: 0; cursor: pointer; background: var(--accent); color: var(--surface); text-decoration: none; font-weight: 600; font-size: 0.92rem; padding: 8px 14px; border-radius: 10px; white-space: nowrap; }
.go.alt { background: var(--accent-soft); color: var(--accent); }
.go svg { width: 18px; height: 18px; flex: none; }
.hint { color: var(--muted); font-size: 0.9rem; }

/* aparat: wybór zajęć + spust */
.shoot { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; display: grid; gap: 1px; min-width: 0; }
.chip b { font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 7px; }
.chip b::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); }
.chip span { color: var(--muted); font-size: 0.8rem; }
.chip .lv { color: var(--accent); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pick { font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
.trigger { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.shutter { appearance: none; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--accent); background: var(--surface); padding: 5px; cursor: pointer; display: grid; place-items: center; }
.shutter span { width: 100%; height: 100%; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--surface); }
.shutter svg { width: 30px; height: 30px; }
.shutter:active span { transform: scale(0.9); }
.shutter[disabled] { opacity: 0.4; cursor: default; }
.tri { display: grid; gap: 6px; min-width: 0; }
.tri b { font-size: 1.05rem; font-weight: 700; }
.tri .for { color: var(--muted); font-size: 0.9rem; }
.tri .go { justify-self: start; }

/* zdjęcia na żywo */
.flow { display: grid; gap: 10px; }
.shot { appearance: none; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; transition: border-color .4s; }
.shot.reading, .shot.upload { border-color: var(--warn); }
.shot.failed, .shot.error { border-color: var(--hot); }
.pic { position: relative; display: block; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; background: var(--bg); }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .6s, transform .6s; }
.pic .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); }
.pic .veil { position: absolute; left: 0; right: 0; top: 0; background: rgb(0 0 0 / 0.5); transition: height .25s; }
.pic .pct { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.05rem; text-shadow: 0 1px 4px rgb(0 0 0 / 0.5); }
.pic .scan { position: absolute; left: -10%; right: -10%; height: 34%; top: -34%; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--warn) 55%, transparent) 70%, var(--warn) 92%, transparent); pointer-events: none; }
.pic .grid { position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--warn) 22%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--warn) 22%, transparent) 1px, transparent 1px); background-size: 46px 46px; pointer-events: none; }
.pic .ok { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-items: center; box-shadow: 0 2px 8px rgb(0 0 0 / 0.25); }
.pic .ok svg { width: 15px; height: 15px; }
.pic .bad { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--hot); color: var(--surface); display: grid; place-items: center; font-weight: 800; }
.shot.queued .pic img { filter: grayscale(0.85) brightness(0.92); }
.shot.reading .pic img { transform: scale(1.06); }
.info { display: grid; gap: 4px; min-width: 0; }
.info .nm { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 0.95rem; min-width: 0; }
.info .nm::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); }
.info .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info .what { font-size: 0.9rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.shot.done .info .what { color: var(--ink); font-weight: 600; }
.shot.failed .info .what, .shot.error .info .what { color: var(--hot); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.steps i { height: 5px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; }
.steps i.on { background: var(--accent); }
.steps i.now { background: var(--warn-soft); }
.steps i.now::after { content: ""; position: absolute; inset: 0; width: 45%; border-radius: 99px; background: var(--warn); }
.steps i.bad { background: var(--hot); }
.legend3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; color: var(--faint); font-size: 0.72rem; }
.time { display: block; color: var(--faint); font-size: 0.8rem; }
.calm { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.92rem; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; }
.calm svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.keybox { flex-wrap: wrap; border-style: solid; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.runerr { color: var(--hot); font-size: 0.9rem; }

@media (prefers-reduced-motion: no-preference) {
  .shot.reading .pic .scan { animation: scan 1.7s cubic-bezier(.45, 0, .55, 1) infinite; }
  .shot.reading .pic .grid { animation: gridfade 1.7s ease-in-out infinite; }
  .shot.queued .pic { animation: breathe 2.4s ease-in-out infinite; }
  .steps i.now::after { animation: slide 1.3s ease-in-out infinite; }
  .shot.pop .pic .ok { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
  .shot.pop { animation: glow 1.2s ease-out both; }
  .shot.enter { animation: enter .45s cubic-bezier(.2, .9, .3, 1) both; }
  .spin { animation: spin .8s linear infinite; }
}
@keyframes scan { from { top: -34%; } to { top: 100%; } }
@keyframes gridfade { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.6; } }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 0%, transparent); } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 35%, transparent); } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(230%); } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 0%, transparent); } }
@keyframes enter { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; flex: none; }

/* wykres: zdjęcia według przedmiotu */
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-left: auto; }
.seg button { appearance: none; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 0.8rem; padding: 4px 9px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.chart { display: grid; gap: 12px; padding: 14px 16px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.crow .cn { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
.crow .cn::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); }
.crow .cn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .cv { font-size: 0.9rem; font-weight: 700; text-align: right; }
.crow .cv small { color: var(--faint); font-weight: 500; }
.track { grid-column: 1 / -1; height: 12px; border-radius: 99px; background: var(--bg); display: flex; overflow: hidden; }
.track i { height: 100%; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.track i.d { background: var(--accent); }
.track i.w { background: var(--warn); }
.track i.f { background: var(--hot); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.8rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.totals { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; color: var(--muted); }
.totals b { color: var(--ink); font-size: 1.05rem; }

/* notatki: foldery i dni */
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
button.row { appearance: none; width: 100%; text-align: left; background: none; border-width: 1px 0 0; border-style: solid; border-color: var(--line); cursor: pointer; }
.card > .row:first-child, .card > button.row:first-child { border-top: 0; }
.row .nm { display: grid; gap: 2px; min-width: 0; }
.row .nm b { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.row .nm b::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.row .nm span { color: var(--muted); font-size: 0.9rem; }
.row .chev { color: var(--faint); font-size: 1.3rem; line-height: 1; }
.fh { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.fh .back { appearance: none; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 0.9rem; padding: 7px 12px; border-radius: 10px; cursor: pointer; }
.fh .t { display: grid; min-width: 0; }
.fh .t b { font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fh .t span { color: var(--muted); font-size: 0.88rem; }
.dz-h { margin-top: 2px; }
.dz-h .t b { white-space: normal; font-size: 1.05rem; line-height: 1.3; }
.row.dz .nm b::before { display: none; }
.row.dz-cur .nm span { color: var(--accent); }
.day { padding: 14px 16px; display: grid; gap: 12px; scroll-margin-top: 130px; }
.day .dh { display: grid; gap: 2px; }
.day .dh small { color: var(--muted); font-size: 0.86rem; }
.day .dh h3 { font-size: 1.15rem; font-weight: 700; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.th { position: relative; flex: none; width: 68px; height: 68px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); cursor: pointer; display: grid; place-items: center; color: var(--faint); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th.pend img { opacity: 0.55; }
.th .bd { position: absolute; right: 4px; bottom: 4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--surface); color: var(--muted); font-size: 0.72rem; font-weight: 700; display: grid; place-items: center; }
.th .bd.err { color: var(--hot); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tools button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 600; font-size: 0.85rem; padding: 5px 11px; border-radius: 99px; cursor: pointer; }
.more { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; justify-self: start; }
.wait { color: var(--warn); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

.md { font-family: var(--serif); font-size: 1.06rem; line-height: 1.7; min-width: 0; overflow-wrap: anywhere; display: grid; gap: 14px; color: var(--ink); }
.day .md > p:first-child { color: var(--muted); font-style: italic; }
.md p { max-width: 64ch; }
.md h4 { font-family: var(--font); font-size: 1.12rem; font-weight: 700; letter-spacing: -0.005em; margin-top: 18px; scroll-margin-top: 140px; }
.md h5, .md h6 { font-family: var(--font); font-size: 1rem; margin-top: 6px; }
.md strong { font-weight: 600; }
.md em { font-style: italic; }
.md sub, .md sup { font-size: 0.72em; line-height: 0; }
